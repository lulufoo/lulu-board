<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" role="img" aria-label="Lulu Drawer">
  <defs>
    <linearGradient id="tile" x1="40" y1="28" x2="200" y2="212" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="sheet" x1="56" y1="52" x2="184" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0f4"/>
    </linearGradient>
    <linearGradient id="accent" x1="132" y1="72" x2="184" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- ground glow -->
  <ellipse cx="120" cy="208" rx="72" ry="10" fill="#000000" opacity="0.18"/>

  <!-- outer tile -->
  <rect x="36" y="28" width="168" height="168" rx="40" fill="url(#tile)" filter="url(#soft)"/>

  <!-- inner sheet -->
  <rect x="56" y="52" width="128" height="120" rx="24" fill="url(#sheet)"/>

  <!-- gutter (split: source | canvas) -->
  <path d="M120 68v88" stroke="#d0d4dc" stroke-width="2" stroke-linecap="round"/>

  <!-- left: source lines -->
  <rect x="70" y="78" width="36" height="7" rx="3.5" fill="#1d1d1f"/>
  <rect x="70" y="94" width="28" height="6" rx="3" fill="#1d1d1f" opacity="0.35"/>
  <rect x="70" y="108" width="32" height="6" rx="3" fill="#1d1d1f" opacity="0.28"/>
  <rect x="70" y="122" width="24" height="6" rx="3" fill="#1d1d1f" opacity="0.22"/>
  <rect x="70" y="136" width="30" height="6" rx="3" fill="#1d1d1f" opacity="0.18"/>

  <!-- right: canvas graph -->
  <circle cx="148" cy="88" r="11" fill="url(#accent)"/>
  <circle cx="172" cy="128" r="11" fill="#1d1d1f"/>
  <circle cx="140" cy="148" r="9" fill="#64748b"/>
  <path d="M148 99c0 10 8 18 24 22" stroke="#1d1d1f" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M161 136c-8 4-14 8-16 12" stroke="#1d1d1f" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>

  <!-- drawer pull (subtle, on tile edge) -->
  <rect x="196" y="96" width="10" height="32" rx="5" fill="url(#accent)"/>
  <rect x="198.5" y="106" width="5" height="12" rx="2.5" fill="#ffffff" opacity="0.35"/>
</svg>
